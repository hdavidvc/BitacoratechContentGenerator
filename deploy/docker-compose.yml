services:
  api:
    build:
      context: ..
      dockerfile: src/BitacoraTech.Api/Dockerfile
    container_name: bitacoratech-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      CONNECTION_STRING: ${CONNECTION_STRING}
      JWT_SECRET: ${JWT_SECRET}
      WORDPRESS_ENCRYPTION_KEY: ${WORDPRESS_ENCRYPTION_KEY}
      Database__ApplyMigrationsOnStartup: "true"
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - bitacoratech-network

  angular:
    build:
      context: ../src/BitacoraTech.Web
    container_name: bitacoratech-angular
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks:
      - bitacoratech-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bitacoratech-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pidof sqlservr >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks:
      - bitacoratech-network

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    container_name: bitacoratech-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      angular:
        condition: service_healthy
    networks:
      - bitacoratech-network

volumes:
  sqlserver-data:

networks:
  bitacoratech-network:
