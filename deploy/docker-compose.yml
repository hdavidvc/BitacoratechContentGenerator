services:
  api:
    build:
      context: ..
      dockerfile: src/BitacoraTech.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CONNECTION_STRING: ${CONNECTION_STRING}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - sqlserver

  worker:
    build:
      context: ..
      dockerfile: src/BitacoraTech.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CONNECTION_STRING: ${CONNECTION_STRING}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      WORDPRESS_ENCRYPTION_KEY: ${WORDPRESS_ENCRYPTION_KEY}
    depends_on:
      - sqlserver

  angular:
    build:
      context: ../src/BitacoraTech.Web
    depends_on:
      - api

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - angular

